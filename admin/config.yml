# Decap CMS 配置（SPRING 作品集）
# 文档：https://decapcms.org/docs/
#
# 后台登录方式：Netlify Identity（邮箱密码，免 GitHub OAuth）
# 已启用下方 git-gateway。需到 Netlify 后台开启 Identity + Git Gateway。

backend:
  name: git-gateway
  branch: main

# 媒体库（本站媒体直接在 JSON 里用路径填写，未启用可视化选图，避免大仓库卡顿）
media_folder: "media"
public_folder: "/media"

# 编辑流程：simple（保存即发布）或 editorial_workflow（先存草稿再发布）
publish_mode: editorial_workflow

collections:
  - name: "site"
    label: "站点设置"
    files:
      - name: "site"
        label: "站点信息"
        file: "content/site.json"
        fields:
          - {name: kicker, label: "首页副标题", widget: string}
          - {name: titleLead, label: "首页主标题（前半）", widget: string}
          - {name: titleEm, label: "首页主标题（强调·斜体衬线）", widget: string, hint: "例如 living images."}
          - {name: footerEyebrow, label: "页脚小标", widget: string}
          - {name: footerTitle, label: "页脚大标题", widget: string}
          - {name: footerBody, label: "页脚正文", widget: text}
          - {name: phone, label: "联系电话（显示）", widget: string, hint: "例如 +86 18066630026"}
          - {name: phoneTel, label: "电话(tel:链接,无空格)", widget: string, hint: "例如 +8618066630026"}
          - {name: contactNote, label: "联系方式备注", widget: string}
          - {name: wechatQr, label: "微信二维码", widget: image, required: false, hint: "点击 Choose image 上传或选择；图片会存入 /media/ 目录"}
          - name: contactB
            label: "第二联系方式（第二首页 home-b.html 用）"
            widget: object
            collapsed: true
            fields:
              - {name: phone, label: "B 联系电话（显示）", widget: string}
              - {name: phoneTel, label: "B 电话(tel:链接,无空格)", widget: string}
              - {name: contactNote, label: "B 联系方式备注", widget: string}
              - {name: wechatQr, label: "B 微信二维码", widget: image, required: false}
          - name: projects
            label: "首页项目顺序"
            widget: list
            summary: "{{fields.slug}}"
            field:
              name: slug
              label: "项目目录名"
              widget: string
              hint: "例如 silver-tides；顺序即首页展示顺序"

  - name: "projects"
    label: "项目"
    folder: "content/projects"
    extension: json
    slug: "{{slug}}"
    fields:
      - {name: slug, label: "目录名（勿改）", widget: string}
      - {name: eyebrow, label: "项目小标", widget: string, hint: "例如 Private Wedding Commission · Xi'an"}
      - {name: title, label: "项目标题", widget: string}
      - {name: statement, label: "一句话定位", widget: string}
      - name: description
        label: "项目描述"
        widget: list
        summary: "{{fields.para}}"
        field:
          name: para
          label: "段落"
          widget: text
      - {name: tone, label: "色调关键词", widget: string, hint: "例如 Ice blue · Silver · Translucence"}
      - {name: cover, label: "封面（首页卡片/下一项目预览）", widget: string, hint: "图片路径，例如 /media/projects/silver-tides/cover.webp"}
      - name: film
        label: "项目视频"
        widget: object
        required: false
        fields:
          - {name: src, label: "视频路径", widget: string}
          - {name: poster, label: "视频封面路径", widget: string}
      - name: gallery
        label: "画廊"
        widget: list
        summary: "分组（{{fields.count}} 张）"
        field:
          name: group
          label: "分组"
          widget: object
          fields:
            - {name: count, label: "图片数量", widget: number}
            - {name: gc, label: "列数(--gc)", widget: number}
            - name: items
              label: "图片"
              widget: list
              summary: "{{fields.src}}"
              field:
                name: item
                label: "图片"
                widget: object
                fields:
                  - {name: src, label: "路径", widget: string}
                  - {name: alt, label: "替代文本", widget: string}
                  - name: caption
                    label: "图注"
                    widget: list
                    field:
                      name: c
                      label: "行"
                      widget: string
      - name: next
        label: "下一项目（自动生成，一般勿改）"
        widget: object
        collapsed: true
        fields:
          - {name: label, label: "标签", widget: string, hint: "例如 Next project · 07"}
          - {name: cover, label: "预览图路径", widget: string}
